<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-zaksy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#14111d"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="img-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0f0d17"/>
    </linearGradient>
    <filter id="glow-z" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bg-grad-zaksy)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="200" r="280" fill="#a855f7" opacity="0.12" filter="url(#glow-z)"/>
  <circle cx="200" cy="550" r="220" fill="#3b82f6" opacity="0.08" filter="url(#glow-z)"/>

  <!-- Mockup Browser Window Frame -->
  <rect x="50" y="40" width="1100" height="670" rx="16" fill="#111116" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="50" y="40" width="1100" height="48" rx="16" fill="#16161f"/>
  <rect x="50" y="72" width="1100" height="16" fill="#16161f"/>
  <line x1="50" y1="88" x2="1150" y2="88" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="80" cy="64" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="64" r="6" fill="#eab308" opacity="0.8"/>
  <circle cx="124" cy="64" r="6" fill="#22c55e" opacity="0.8"/>

  <!-- URL Address Bar -->
  <rect x="360" y="52" width="480" height="24" rx="6" fill="#0d0e14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="600" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.5">preview.mkwebstudio.com/showcase/zaksy-studio</text>

  <!-- Showcase Badge in Bar -->
  <rect x="1030" y="52" width="90" height="24" rx="12" fill="rgba(192,132,252,0.15)" stroke="rgba(192,132,252,0.4)" stroke-width="1"/>
  <circle cx="1044" cy="64" r="3.5" fill="#c084fc"/>
  <text x="1080" y="68" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SHOWCASE</text>

  <!-- Website Content Area -->
  <!-- Top Nav Mock -->
  <text x="90" y="130" fill="#ffffff" font-family="'Cinzel', serif, system-ui" font-size="18" font-weight="700" letter-spacing="2">ZAKSY STUDIO</text>
  <text x="800" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">RESIDENTIAL</text>
  <text x="910" y="128" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">COMMERCIAL</text>
  <text x="1010" y="128" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INQUIRE</text>

  <!-- Hero Content inside Browser -->
  <text x="90" y="180" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="3">ARCHITECTURAL INTERIORS</text>
  <text x="90" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">CRAFTING TIMELESS</text>
  <text x="90" y="275" fill="url(#gold-grad)" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">LIVING SPACES.</text>
  <text x="90" y="315" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" max-width="450">Bespoke luxury residential &amp; boutique commercial interior architecture.</text>

  <!-- CTA Button inside mock -->
  <rect x="90" y="340" width="160" height="42" rx="8" fill="#a855f7"/>
  <text x="170" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">VIEW PORTFOLIO</text>

  <!-- Visual Project Cards inside Browser -->
  <!-- Right Big Feature Hero Image Mock -->
  <rect x="620" y="170" width="500" height="230" rx="12" fill="url(#img-grad-1)" stroke="rgba(192,132,252,0.25)" stroke-width="1.5"/>
  <!-- Architectural Room illustration lines -->
  <path d="M 640 370 L 760 220 L 1080 220 L 1100 370 Z" fill="#242138" opacity="0.6"/>
  <line x1="760" y1="220" x2="760" y2="370" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
  <rect x="800" y="250" width="180" height="110" rx="6" fill="#312d4a" stroke="#c084fc" stroke-width="1" opacity="0.7"/>
  <!-- Couch/Living element -->
  <rect x="830" y="310" width="120" height="40" rx="6" fill="#581c87" opacity="0.8"/>
  <text x="645" y="390" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">The Obsidian Penthouse — 4,200 sq.ft</text>

  <!-- 3 Project Gallery Cards along bottom -->
  <rect x="90" y="440" width="310" height="210" rx="10" fill="#171622" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="105" y="455" width="280" height="120" rx="6" fill="#26223b"/>
  <!-- Minimalist Room lines -->
  <line x1="125" y1="550" x2="365" y2="550" stroke="#7e22ce" stroke-width="2" opacity="0.5"/>
  <circle cx="245" cy="510" r="28" fill="#9333ea" opacity="0.3"/>
  <text x="105" y="605" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Villa Serena, Jubilee Hills</text>
  <text x="105" y="625" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11">Residential Architecture</text>

  <rect x="440" y="440" width="310" height="210" rx="10" fill="#171622" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="455" y="455" width="280" height="120" rx="6" fill="#201d33"/>
  <!-- Modern office interior lines -->
  <rect x="495" y="490" width="100" height="60" rx="4" fill="#3b0764" opacity="0.7"/>
  <rect x="615" y="490" width="90" height="60" rx="4" fill="#4c1d95" opacity="0.7"/>
  <text x="455" y="605" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Aethelgard Design Studio</text>
  <text x="455" y="625" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11">Commercial Workspace</text>

  <rect x="790" y="440" width="330" height="210" rx="10" fill="#171622" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="805" y="455" width="300" height="120" rx="6" fill="#27233f"/>
  <circle cx="955" cy="515" r="35" fill="#a855f7" opacity="0.4"/>
  <text x="805" y="605" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Lumière Luxury Lounge</text>
  <text x="805" y="625" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11">Hospitality Interiors</text>
</svg>
