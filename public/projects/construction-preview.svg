<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-const" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="50%" stop-color="#141a23"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="yellow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-grad-const)"/>
  <circle cx="950" cy="220" r="280" fill="#eab308" opacity="0.1" filter="url(#glow-c)"/>
  <circle cx="200" cy="500" r="200" fill="#3b82f6" opacity="0.08" filter="url(#glow-c)"/>

  <!-- Browser Frame -->
  <rect x="50" y="40" width="1100" height="670" rx="16" fill="#0f141c" stroke="rgba(250,204,21,0.2)" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="50" y="40" width="1100" height="48" rx="16" fill="#141b26"/>
  <rect x="50" y="72" width="1100" height="16" fill="#141b26"/>
  <line x1="50" y1="88" x2="1150" y2="88" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <circle cx="80" cy="64" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="64" r="6" fill="#eab308" opacity="0.8"/>
  <circle cx="124" cy="64" r="6" fill="#22c55e" opacity="0.8"/>

  <rect x="360" y="52" width="480" height="24" rx="6" fill="#090d14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">preview.mkwebstudio.com/concepts/vanguard-infra</text>

  <!-- Concept Badge -->
  <rect x="1030" y="52" width="90" height="24" rx="12" fill="rgba(250,204,21,0.15)" stroke="rgba(250,204,21,0.4)" stroke-width="1"/>
  <circle cx="1044" cy="64" r="3.5" fill="#facc15"/>
  <text x="1080" y="68" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CONCEPT</text>

  <!-- Nav -->
  <text x="90" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="1">VANGUARD INFRA</text>
  <text x="800" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">CAPABILITIES</text>
  <text x="910" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">PROJECTS</text>
  <rect x="990" y="118" width="130" height="32" rx="6" fill="#eab308"/>
  <text x="1055" y="138" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">REQUEST TENDER</text>

  <!-- Hero Content inside mock -->
  <text x="90" y="200" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">CIVIL &amp; COMMERCIAL INFRASTRUCTURE</text>
  <text x="90" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">BUILDING THE FUTURE</text>
  <text x="90" y="295" fill="url(#yellow-gold)" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">ON RIGID PRECISION.</text>
  <text x="90" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Heavy engineering, turnkey industrial parks, LEED certified skyscrapers, and transport bridges.</text>

  <!-- Right Visual Spec Box inside mock -->
  <rect x="680" y="170" width="440" height="240" rx="14" fill="#141e2b" stroke="rgba(250,204,21,0.25)" stroke-width="1.5"/>
  <!-- Crane & Construction Grid graphic -->
  <path d="M 720 380 L 800 210 L 1060 210" stroke="#facc15" stroke-width="3" fill="none"/>
  <line x1="800" y1="210" x2="800" y2="380" stroke="#facc15" stroke-width="2" opacity="0.6"/>
  <line x1="900" y1="210" x2="900" y2="280" stroke="#facc15" stroke-width="2" opacity="0.6"/>
  <rect x="880" y="280" width="40" height="30" fill="#ca8a04"/>
  <!-- Stats row inside graphic -->
  <rect x="710" y="330" width="380" height="60" rx="8" fill="#0b111a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="735" y="355" fill="#facc15" font-family="system-ui, sans-serif" font-size="16" font-weight="800">100%</text>
  <text x="735" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Safety Compliance</text>
  <text x="870" y="355" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ISO 9001</text>
  <text x="870" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Certified Quality</text>
  <text x="980" y="355" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Turnkey</text>
  <text x="980" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">EPC Delivery</text>

  <!-- 3 Project Cards inside mock -->
  <rect x="90" y="445" width="320" height="205" rx="10" fill="#131b26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="105" y="460" width="290" height="90" rx="6" fill="#1d2737"/>
  <text x="105" y="580" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">AeroTech Commercial Park</text>
  <text x="105" y="605" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">1.8M sq.ft industrial technology zone with pre-stressed concrete architecture.</text>

  <rect x="440" y="445" width="320" height="205" rx="10" fill="#131b26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="455" y="460" width="290" height="90" rx="6" fill="#1d2737"/>
  <text x="455" y="580" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Solaria Metro Viaduct</text>
  <text x="455" y="605" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Elevated transport corridor with seismic dampers and smart lighting.</text>

  <rect x="790" y="445" width="330" height="205" rx="10" fill="#131b26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="805" y="460" width="300" height="90" rx="6" fill="#1d2737"/>
  <text x="805" y="580" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Apex High-Rise Residency</text>
  <text x="805" y="605" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">44-storey earthquake-resistant luxury residential monolith.</text>
</svg>
