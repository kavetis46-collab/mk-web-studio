<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-dental" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0c1729"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow-d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg-grad-dental)"/>
  <circle cx="950" cy="220" r="280" fill="#0284c7" opacity="0.1" filter="url(#glow-d)"/>
  <circle cx="200" cy="500" r="200" fill="#38bdf8" opacity="0.08" filter="url(#glow-d)"/>

  <!-- Browser Frame -->
  <rect x="50" y="40" width="1100" height="670" rx="16" fill="#0b1120" stroke="rgba(56,189,248,0.2)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="50" y="40" width="1100" height="48" rx="16" fill="#0f172a"/>
  <rect x="50" y="72" width="1100" height="16" fill="#0f172a"/>
  <line x1="50" y1="88" x2="1150" y2="88" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Controls -->
  <circle cx="80" cy="64" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="64" r="6" fill="#eab308" opacity="0.8"/>
  <circle cx="124" cy="64" r="6" fill="#22c55e" opacity="0.8"/>

  <!-- URL Address -->
  <rect x="360" y="52" width="480" height="24" rx="6" fill="#070d18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="600" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">preview.mkwebstudio.com/concepts/apex-dental-care</text>

  <!-- Concept Badge -->
  <rect x="1030" y="52" width="90" height="24" rx="12" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <circle cx="1044" cy="64" r="3.5" fill="#38bdf8"/>
  <text x="1080" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CONCEPT</text>

  <!-- Clinic Brand Bar -->
  <circle cx="95" cy="130" r="14" fill="#0284c7" opacity="0.2"/>
  <path d="M 90 125 Q 95 120 100 125 Q 102 135 95 138 Q 88 135 90 125" fill="#38bdf8"/>
  <text x="120" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">APEX DENTAL</text>
  <text x="800" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">TREATMENTS</text>
  <text x="910" y="134" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">DOCTORS</text>
  <rect x="990" y="118" width="130" height="32" rx="6" fill="#0284c7"/>
  <text x="1055" y="138" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BOOK APPOINTMENT</text>

  <!-- Hero Content inside mock -->
  <text x="90" y="200" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2">MODERN COMPREHENSIVE DENTISTRY</text>
  <text x="90" y="250" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">WORLD-CLASS CARE</text>
  <text x="90" y="295" fill="url(#cyan-blue)" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">FOR CONFIDENT SMILES.</text>
  <text x="90" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Painless laser treatments, cosmetic smile design, and 3D dental diagnostics.</text>

  <!-- Interactive Appointment Widget Card inside mock -->
  <rect x="680" y="170" width="440" height="240" rx="14" fill="#131c2e" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
  <text x="710" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Instant Appointment Request</text>
  <text x="710" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Select your preferred date and treatment:</text>
  <rect x="710" y="240" width="180" height="34" rx="6" fill="#0a101d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="725" y="262" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Select Treatment ▾</text>
  <rect x="910" y="240" width="180" height="34" rx="6" fill="#0a101d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="925" y="262" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">Preferred Date 📅</text>
  <rect x="710" y="290" width="380" height="34" rx="6" fill="#0a101d" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="725" y="312" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Your Phone / WhatsApp Number</text>
  <rect x="710" y="340" width="380" height="42" rx="8" fill="url(#cyan-blue)"/>
  <text x="900" y="366" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Confirm Appointment Slot →</text>

  <!-- 3 Service Cards inside mock -->
  <rect x="90" y="445" width="320" height="205" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="130" cy="485" r="20" fill="rgba(56,189,248,0.15)"/>
  <text x="130" y="492" fill="#38bdf8" font-size="16" text-anchor="middle">✨</text>
  <text x="165" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Cosmetic Dentistry</text>
  <text x="110" y="525" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Porcelain veneers, teeth whitening &amp; smile makeover plans with 3D preview.</text>
  <text x="110" y="615" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Explore Treatment →</text>

  <rect x="440" y="445" width="320" height="205" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="480" cy="485" r="20" fill="rgba(56,189,248,0.15)"/>
  <text x="480" y="492" fill="#38bdf8" font-size="16" text-anchor="middle">🦷</text>
  <text x="515" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Dental Implants</text>
  <text x="460" y="525" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Titanium &amp; zirconia implants with computer-guided painless precision.</text>
  <text x="460" y="615" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Explore Treatment →</text>

  <rect x="790" y="445" width="330" height="205" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="830" cy="485" r="20" fill="rgba(56,189,248,0.15)"/>
  <text x="830" y="492" fill="#38bdf8" font-size="16" text-anchor="middle">🛡️</text>
  <text x="865" y="488" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Clear Aligners</text>
  <text x="810" y="525" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Invisible orthodontic aligners for teens and adults with digital progress scan.</text>
  <text x="810" y="615" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Explore Treatment →</text>
</svg>
