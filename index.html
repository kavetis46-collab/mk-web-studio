<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Primary Meta Tags -->
    <title>MK Web Studio | Premium AI-Assisted Website Design & Development Agency</title>
    <meta name="title" content="MK Web Studio | Premium AI-Assisted Website Design & Development Agency" />
    <meta name="description" content="MK Web Studio is a premier digital agency building high-performance, custom websites for interior designers, architects, healthcare clinics, restaurants, and ambitious businesses worldwide." />
    <meta name="keywords" content="web design agency, interior design website, dental clinic web development, restaurant websites, custom react development, high performance website, MK Web Studio" />
    <meta name="author" content="MK Web Studio" />
    <meta name="theme-color" content="#070709" />
    <link rel="canonical" href="https://mkwebstudio.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mkwebstudio.com/" />
    <meta property="og:title" content="MK Web Studio | Transforming Businesses Into Digital Experiences" />
    <meta property="og:description" content="We build websites that build businesses. Bespoke AI-assisted web design and modern engineering with sub-second performance." />
    <meta property="og:image" content="https://mkwebstudio.com/projects/zaksy-preview.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mkwebstudio.com/" />
    <meta property="twitter:title" content="MK Web Studio | Premium Web Agency" />
    <meta property="twitter:description" content="Transforming businesses into digital experiences. High performance, conversion-focused websites." />
    <meta property="twitter:image" content="https://mkwebstudio.com/projects/zaksy-preview.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#070709] text-[#f3f4f6] selection:bg-blue-600/30 selection:text-blue-200 antialiased overflow-x-hidden">
    <!-- Netlify static detection form for SPA -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="text" name="businessName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="category" />
      <input type="text" name="requirement" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
